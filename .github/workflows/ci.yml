name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plans:
    name: Select Seoul examples
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plans: ${{ steps.matrix.outputs.plans }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Select every canonical Seoul example
        id: matrix
        run: |
          node --input-type=module -e 'import { REGIONAL_DEMO_LAYOUTS } from "./src/demo-layouts.js"; if (REGIONAL_DEMO_LAYOUTS.length !== 3) throw new Error("Expected three Seoul examples"); console.log("plans=" + JSON.stringify(REGIONAL_DEMO_LAYOUTS.map(({ id }) => id)));' >> "$GITHUB_OUTPUT"

  core:
    name: Validate core application
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Korean browser fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Run syntax, unit, and build checks
        run: npm run check
      - name: Run browser interaction audit
        run: npm run test:browser:mobile
      - name: Run simple workspace and direct manipulation audit
        run: npm run test:browser:simple
      - name: Run prebuilt asset and 3D editing audit
        run: npm run test:browser:assets
      - name: Run consultation and recovery audit
        run: npm run test:browser:consultation
      - name: Run real-plan door and traversal audit
        run: npm run test:browser:real-plans
      - name: Upload browser audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-audit-${{ github.run_attempt }}
          path: .omx/artifacts/mobile-ux-hardening/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload simple workspace artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: simple-workspace-audit-${{ github.run_attempt }}
          path: |
            .omx/artifacts/simple-workspace/
            .omx/artifacts/simple-gestures/
            .omx/artifacts/simple-3d/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload prebuilt asset and 3D editing artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: seoul-assets-audit-${{ github.run_attempt }}
          path: |
            .omx/artifacts/seoul-assets/
            .omx/artifacts/studio3d/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload real-plan browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: real-plan-browser-audit-${{ github.run_attempt }}
          path: .omx/artifacts/real-plan-navigation/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload consultation browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: consultation-browser-audit-${{ github.run_attempt }}
          path: |
            .omx/artifacts/consultation/
            .omx/artifacts/consultation-cloud/
          if-no-files-found: warn
          retention-days: 7

  regional:
    name: Seoul tour (${{ matrix.plan }})
    needs: plans
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        plan: ${{ fromJSON(needs.plans.outputs.plans) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Korean browser fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Build the actual application
        run: npm run build -- --base=./
      - name: Run complete example visibility, responsive and traversal audit
        env:
          REAL_PLAN_AUDIT_ID: ${{ matrix.plan }}
          REAL_PLAN_AUDIT_TIMEOUT_MS: 3000000
        run: npm run test:browser:regional
      - name: Upload this example's browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: regional-${{ matrix.plan }}-${{ github.run_attempt }}
          path: .omx/artifacts/regional-navigation/
          if-no-files-found: error
          retention-days: 7

  check:
    name: Validate application
    needs: [plans, core, regional]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          PLANS_RESULT: ${{ needs.plans.result }}
          CORE_RESULT: ${{ needs.core.result }}
          REGIONAL_RESULT: ${{ needs.regional.result }}
        run: |
          test "$PLANS_RESULT" = success
          test "$CORE_RESULT" = success
          test "$REGIONAL_RESULT" = success
