name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plans:
    name: Select every plan example
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plans: ${{ steps.matrix.outputs.plans }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Select every canonical plan example
        id: matrix
        run: |
          node --input-type=module -e '
            import { DEMO_LAYOUTS, REGIONAL_DEMO_LAYOUTS } from "./src/demo-layouts.js";
            if (DEMO_LAYOUTS.length !== 3 || REGIONAL_DEMO_LAYOUTS.length !== 3) throw new Error("Expected three LH and three Seoul examples");
            const plans = [
              ...DEMO_LAYOUTS.map(({ id }) => ({ id, script: "test:browser:real-plans" })),
              ...REGIONAL_DEMO_LAYOUTS.map(({ id }) => ({ id, script: "test:browser:regional" })),
            ];
            console.log("plans=" + JSON.stringify(plans));
          ' >> "$GITHUB_OUTPUT"

  core:
    name: Validate core application
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Korean browser fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Run syntax, unit, and build checks
        run: npm run check
      - name: Run browser interaction audit
        run: npm run test:browser:mobile
      - name: Run simple workspace and direct manipulation audit
        run: npm run test:browser:simple
      - name: Run space and detail editing boundary audit
        run: npm run test:browser:spaces
      - name: Run prebuilt asset and 3D editing audit
        run: npm run test:browser:assets
      - name: Run consultation and recovery audit
        run: npm run test:browser:consultation
      - name: Upload browser audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-audit-${{ github.run_attempt }}
          path: .omx/artifacts/mobile-ux-hardening/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload simple workspace artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: simple-workspace-audit-${{ github.run_attempt }}
          path: |
            .omx/artifacts/simple-workspace/
            .omx/artifacts/simple-gestures/
            .omx/artifacts/simple-3d/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload prebuilt asset and 3D editing artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: seoul-assets-audit-${{ github.run_attempt }}
          path: |
            .omx/artifacts/seoul-assets/
            .omx/artifacts/studio3d/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload space and detail editing artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: space-detail-audit-${{ github.run_attempt }}
          path: |
            .omx/artifacts/space-only/
            .omx/artifacts/studio3d-details/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload consultation browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: consultation-browser-audit-${{ github.run_attempt }}
          path: |
            .omx/artifacts/consultation/
            .omx/artifacts/consultation-cloud/
          if-no-files-found: warn
          retention-days: 7

  tours:
    name: Floor-plan tour (${{ matrix.id }})
    needs: plans
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plans.outputs.plans) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Korean browser fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Build the actual application
        run: npm run build -- --base=./
      - name: Run complete example visibility, responsive and traversal audit
        env:
          REAL_PLAN_AUDIT_ID: ${{ matrix.id }}
          REAL_PLAN_AUDIT_TIMEOUT_MS: 3000000
          AUDIT_SCRIPT: ${{ matrix.script }}
        run: npm run "$AUDIT_SCRIPT"
      - name: Upload this example's browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plan-${{ matrix.id }}-${{ github.run_attempt }}
          path: |
            .omx/artifacts/real-plan-navigation/
            .omx/artifacts/regional-navigation/
          if-no-files-found: error
          retention-days: 7

  check:
    name: Validate application
    needs: [plans, core, tours]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          PLANS_RESULT: ${{ needs.plans.result }}
          CORE_RESULT: ${{ needs.core.result }}
          TOURS_RESULT: ${{ needs.tours.result }}
        run: |
          test "$PLANS_RESULT" = success
          test "$CORE_RESULT" = success
          test "$TOURS_RESULT" = success
