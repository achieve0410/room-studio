name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run syntax, unit, and build checks
        run: npm run check
      - name: Run browser interaction audit
        run: npm run test:browser:mobile
      - name: Upload browser audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-audit-${{ github.run_attempt }}
          path: .omx/artifacts/mobile-ux-hardening/
          if-no-files-found: warn
          retention-days: 7
